<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mridha International Corporation (RL-1108) | Contact Us</title>
<meta name="description" content="Official contact page of Mridha International Corporation (RL-1108), A Sister Concern of Mridha Group. Call, email, visit website or find our location in Banani, Dhaka.">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Mridha International Corporation (RL-1108)">
<meta property="og:description" content="A Sister Concern of Mridha Group - Official Contact Details">
<meta property="og:type" content="website">
<style>
  :root{
    --gold:#D4AF37;
    --gold-light:#f5e6b8;
    --dark-green:#0b3d2e;
    --dark-green-2:#124a37;
    --white:#ffffff;
    --text-dark:#1c1c1c;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html,body{
    height:100%;
  }

  body{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:linear-gradient(135deg, var(--dark-green) 0%, var(--dark-green-2) 55%, #0a2f23 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .card{
    background:var(--white);
    width:100%;
    max-width:460px;
    border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    overflow:hidden;
    text-align:center;
    border:2px solid var(--gold);
    animation:fadeIn 0.6s ease;
  }

  @keyframes fadeIn{
    from{opacity:0; transform:translateY(16px);}
    to{opacity:1; transform:translateY(0);}
  }

  .card-header{
    background:linear-gradient(135deg, var(--dark-green) 0%, var(--dark-green-2) 100%);
    padding:32px 20px 24px;
    position:relative;
  }

  .logo{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    background:var(--white);
    border:4px solid var(--gold);
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
  }

  .company-name{
    color:var(--white);
    font-size:1.55rem;
    font-weight:800;
    letter-spacing:0.5px;
    margin-top:16px;
    line-height:1.3;
    text-transform:uppercase;
  }

  .reg-no{
    color:var(--gold-light);
    font-size:0.85rem;
    margin-top:4px;
    font-weight:600;
    letter-spacing:0.5px;
  }

  .tagline{
    color:var(--gold);
    font-size:0.9rem;
    font-style:italic;
    margin-top:10px;
    font-weight:500;
  }

  .card-body{
    padding:26px 24px 30px;
  }

  .address{
    color:var(--text-dark);
    font-size:0.95rem;
    line-height:1.6;
    margin-bottom:24px;
    padding:14px 16px;
    background:#faf7ec;
    border-left:4px solid var(--gold);
    border-radius:8px;
    text-align:left;
  }

  .address strong{
    color:var(--dark-green);
    display:block;
    margin-bottom:4px;
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .btn-group{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    padding:14px 18px;
    border-radius:12px;
    font-size:1rem;
    font-weight:700;
    letter-spacing:0.3px;
    transition:all 0.25s ease;
    border:2px solid transparent;
  }

  .btn-icon{
    font-size:1.1rem;
  }

  .btn-call{
    background:var(--dark-green);
    color:var(--white);
  }
  .btn-call:hover{
    background:var(--dark-green-2);
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(11,61,46,0.35);
  }

  .btn-email{
    background:var(--gold);
    color:var(--dark-green);
  }
  .btn-email:hover{
    background:#c19d2e;
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(212,175,55,0.4);
  }

  .btn-website{
    background:var(--white);
    color:var(--dark-green);
    border:2px solid var(--dark-green);
  }
  .btn-website:hover{
    background:var(--dark-green);
    color:var(--white);
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(11,61,46,0.25);
  }

  .btn-location{
    background:var(--white);
    color:#a8842a;
    border:2px solid var(--gold);
  }
  .btn-location:hover{
    background:var(--gold);
    color:var(--white);
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(212,175,55,0.35);
  }

  .footer-note{
    margin-top:22px;
    font-size:0.75rem;
    color:#888;
  }

  @media (max-width:480px){
    .company-name{
      font-size:1.3rem;
    }
    .logo{
      width:90px;
      height:90px;
    }
    .btn{
      font-size:0.95rem;
      padding:13px 16px;
    }
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <img src="logo.jpg" alt="Mridha International Corporation Logo" class="logo">
    <div class="company-name">Mridha International<br>Corporation</div>
    <div class="reg-no">RL-1108</div>
    <div class="tagline">A Sister Concern of Mridha Group</div>
  </div>

  <div class="card-body">
    <div class="address">
      <strong>Registered Address</strong>
      Awal Center, Floor 11<br>
      34 Kemal Ataturk Avenue<br>
      Banani, Dhaka-1213, Bangladesh
    </div>

    <div class="btn-group">
      <a href="tel:+8801552633055" class="btn btn-call">
        <span class="btn-icon">📞</span> Call Now
      </a>
      <a href="mailto:mridha.mic@gmail.com" class="btn btn-email">
        <span class="btn-icon">✉️</span> Send Email
      </a>
      <a href="https://www.mridagroup.com" class="btn btn-website" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon">🌐</span> Visit Website
      </a>
      <a href="https://maps.google.com/?q=Awal+Center+34+Kemal+Ataturk+Avenue+Banani+Dhaka-1213" class="btn btn-location" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon">📍</span> View Location
      </a>
    </div>

    <div class="footer-note">
      &copy; Mridha International Corporation. All rights reserved.
    </div>
  </div>
</div>

</body>
</html>
